---
# tasks file for build
- name: Ensure packages for build are present
  apt: name={{ item }} state=present
  with_items:
    - default-jdk
    - maven

- name: Copy build-app data
  copy:
    src={{ src }}
    dest={{ dest }}

- name: Build app package
  command: mvn package
  args:
    chdir: /tmp/build_data/